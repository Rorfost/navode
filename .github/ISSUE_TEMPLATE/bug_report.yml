name: Bug report
description: Report unexpected Navode behavior.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and Navode version
