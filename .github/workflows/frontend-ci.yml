name: Frontend CI

on:
  pull_request:
    paths:
      [
        'apps/web/**',
        'packages/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'eslint.config.mjs',
        'tsconfig.base.json',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/web/**',
        'packages/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'eslint.config.mjs',
        'tsconfig.base.json',
      ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @navode/web typecheck
      - run: pnpm --filter @navode/web test
      - run: pnpm build:web
