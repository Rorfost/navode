name: Extension CI

on:
  pull_request:
    paths:
      [
        'apps/extension/**',
        'packages/**',
        'scripts/check-extension.mjs',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/extension/**',
        'packages/**',
        'scripts/check-extension.mjs',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
      ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @navode/extension typecheck
      - run: pnpm --filter @navode/extension test
      - run: pnpm build:extension
      - uses: actions/upload-artifact@v4
        with: { name: navode-extension, path: apps/extension/dist }
